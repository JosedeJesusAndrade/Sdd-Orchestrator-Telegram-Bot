repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - python-telegram-bot>=21.0
          - nest-asyncio>=1.6.0
          - python-dotenv>=1.0.0
          - openai>=1.0.0
