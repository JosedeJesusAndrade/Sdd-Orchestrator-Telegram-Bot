[project]
name = "sdd-orchestrator-telegram-bot"
version = "0.1.0"
description = "Telegram bot bridge for SDD Orchestrator with OpenCode CLI"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy==2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
gui = [
    "flet>=1.0",
]

[tool.setuptools]
packages = [
    "formatting",
    "handlers",
    "locales",
    "opencode",
    "persistence",
    "services",
    "tmp",
    "utils",
]
py-modules = ["bot", "config", "get_chat_id"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "."
exclude = '^(tmp/|get_chat_id\.py)'
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nest_asyncio.*"
ignore_missing_imports = true

# RATCHET: tests are checked but not forced to full strict yet.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
